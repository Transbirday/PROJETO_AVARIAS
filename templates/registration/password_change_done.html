{% extends 'base.html' %}

{% block title %}Senha Alterada{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Senha Alterada</h1>
</div>

<div class="card shadow-sm col-md-8 col-lg-6 mx-auto mt-4">
    <div class="card-body text-center py-5">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
        <h3 class="mt-4 mb-3">Senha Alterada com Sucesso!</h3>
        <p class="text-muted">Sua senha foi alterada. Você já pode usar a nova senha no próximo login.</p>

        <div class="mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">Voltar ao Início</a>
        </div>
    </div>
</div>
{% endblock %}
